<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oups! Portal - Login</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      /* ── Top-bar with language picker ── */
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 8px 16px;
        background: transparent;
        z-index: 100;
      }
      .lang-widget {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #fff;
        border: 1px solid #c7cfdd;
        border-radius: 8px;
        padding: 6px 10px;
      }
      .lang-icon {
        font-size: 1.1rem;
        line-height: 1;
        /* pure CSS globe — no external dependency */
      }
      #language {
        border: none;
        background: transparent;
        font-size: 0.95rem;
        cursor: pointer;
        padding: 0;
        width: auto;
      }
      #language:focus {
        outline: 2px solid #3858e9;
        border-radius: 4px;
      }

      /* ── Login card ── */
      main {
        width: min(90vw, 380px);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        padding: 24px;
        margin-top: 56px; /* clear the fixed topbar */
      }
      .logo {
        display: block;
        margin: 0 auto 20px auto;
        width: 120px;
        height: auto;
      }
      h1 {
        margin: 0 0 16px;
        text-align: center;
        font-size: 1.4rem;
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-weight: 600;
      }
      input,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #c7cfdd;
        border-radius: 8px;
        font-size: 1rem;
      }
      button {
        background: #3858e9;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      .submit-button {
        margin-top: 20px;
        margin-bottom: 20px;
      }
      button:hover {
        background: #2d49c4;
      }
      .btn-secondary {
        background: transparent;
        color: #3858e9;
        border: 1px solid #3858e9;
      }
      .btn-secondary:hover {
        background: #eef0fc;
      }
      .btn-link {
        display: inline-block;
        width: auto;
        background: transparent;
        color: #3858e9;
        border: none;
        text-decoration: underline;
        padding: 8px 0 0;
        font-size: 0.9rem;
      }
      .btn-link:hover {
        color: #2d49c4;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <!-- Language selector — fixed upper-right corner -->
    <nav class="topbar" aria-label="Language selector">
      <div class="lang-widget">
        <span class="lang-icon" aria-hidden="true">🌐</span>
        <select id="language" name="language">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
          <option value="de">Deutsch</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </nav>

    <main>
      <img
        class="logo"
        src="https://oups-app.com/logo+oups-01.png"
        alt="Oups! app logo"
      />
      <h1 data-i18n="title">Sign in to Oups! portal</h1>
      <form>
        <label for="email" data-i18n="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus />

        <label for="password" data-i18n="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <button type="button" class="btn-link" data-i18n="forgotPassword">
          Forgot password?
        </button>

        <button type="submit" class="submit-button" data-i18n="submit">Login</button>

        <button type="button" class="btn-secondary" data-i18n="createAccount">
          Create an account
        </button>
      </form>
    </main>
    <script>
      const translations = {
        en: {
          title: 'Sign in to Oups! portal',
          email: 'Email',
          password: 'Password',
          submit: 'Login',
          forgotPassword: 'Forgot password?',
          createAccount: 'Create an account',
          logoAlt: 'Oups! app logo',
        },
        fr: {
          title: 'Se connecter au portail Oups!',
          email: 'Courriel',
          password: 'Mot de passe',
          submit: 'Se connecter',
          forgotPassword: 'Mot de passe oublié ?',
          createAccount: 'Créer un compte',
          logoAlt: "Logo de l'application Oups!",
        },
        es: {
          title: 'Iniciar sesión en el portal de Oups!',
          email: 'Correo electrónico',
          password: 'Contraseña',
          submit: 'Ingresar',
          forgotPassword: '¿Olvidaste tu contraseña?',
          createAccount: 'Crear una cuenta',
          logoAlt: 'Logotipo de la aplicación Oups!',
        },
        pt: {
          title: 'Entrar no portal Oups!',
          email: 'E-mail',
          password: 'Senha',
          submit: 'Entrar',
          forgotPassword: 'Esqueceu a senha?',
          createAccount: 'Criar uma conta',
          logoAlt: 'Logotipo do aplicativo Oups!',
        },
        de: {
          title: 'Bei Oups!-Portal anmelden',
          email: 'E-Mail',
          password: 'Passwort',
          submit: 'Einloggen',
          forgotPassword: 'Passwort vergessen?',
          createAccount: 'Konto erstellen',
          logoAlt: 'Logo der Oups!-App',
        },
        ja: {
          title: 'Oups!ポータルにサインイン',
          email: 'メールアドレス',
          password: 'パスワード',
          submit: 'ログイン',
          forgotPassword: 'パスワードをお忘れですか？',
          createAccount: 'アカウントを作成',
          logoAlt: 'Oups!アプリのロゴ',
        },
      };

      function applyLanguage(lang) {
        const t = translations[lang] || translations.en;
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          if (key in t) {
            el.textContent = t[key];
          }
        });
        const logo = document.querySelector('img.logo');
        if (logo) {
          logo.alt = t.logoAlt;
        }
      }

      const select = document.getElementById('language');
      select.addEventListener('change', () => {
        applyLanguage(select.value);
        localStorage.setItem('oups-lang', select.value);
      });

      // Determine which language to use:
      // 1. A previously saved preference stored in localStorage.
      // 2. The primary language tag of the browser's UI language.
      // 3. Fall back to 'en'.
      const saved = localStorage.getItem('oups-lang');
      if (saved && saved in translations) {
        select.value = saved;
        applyLanguage(saved);
      } else {
        const browserLang = (navigator.language || '').split('-')[0].toLowerCase();
        if (browserLang && browserLang in translations) {
          select.value = browserLang;
          applyLanguage(browserLang);
        }
      }
    </script>
  </body>
</html>
