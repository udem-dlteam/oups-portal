<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oups! Portal - Login</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(90vw, 380px);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        padding: 24px;
      }
      .logo {
        display: block;
        margin: 0 auto 20px auto;
        width: 120px;
        height: auto;
      }
      h1 {
        margin: 0 0 16px;
        text-align: center;
        font-size: 1.4rem;
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-weight: 600;
      }
      input,
      select,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #c7cfdd;
        border-radius: 8px;
        font-size: 1rem;
      }
      button {
        margin-top: 16px;
        background: #3858e9;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background: #2d49c4;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="logo"
        src="https://oups-app.com/wp-content/uploads/2020/04/logo-oups.png"
        alt="Oups! app logo"
      />
      <h1>Sign in</h1>
      <form>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <label for="language">Language</label>
        <select id="language" name="language" aria-label="Language selector">
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="pt">Portuguese</option>
          <option value="de">German</option>
          <option value="ja">Japanese</option>
        </select>

        <button type="submit">Login</button>
      </form>
    </main>
  </body>
</html>
