<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oups! Portal - Login</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(90vw, 380px);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        padding: 24px;
      }
      .logo {
        display: block;
        margin: 0 auto 20px auto;
        width: 120px;
        height: auto;
      }
      h1 {
        margin: 0 0 16px;
        text-align: center;
        font-size: 1.4rem;
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-weight: 600;
      }
      input,
      select,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #c7cfdd;
        border-radius: 8px;
        font-size: 1rem;
      }
      button {
        margin-top: 16px;
        background: #3858e9;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background: #2d49c4;
      }
      .btn-secondary {
        background: transparent;
        color: #3858e9;
        border: 1px solid #3858e9;
      }
      .btn-secondary:hover {
        background: #eef0fc;
      }
      .btn-link {
        background: transparent;
        color: #3858e9;
        border: none;
        text-decoration: underline;
        padding: 6px 0;
        font-size: 0.9rem;
      }
      .btn-link:hover {
        color: #2d49c4;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="logo"
        src="https://oups-app.com/wp-content/uploads/2020/04/logo-oups.png"
        alt="Oups! app logo"
      />
      <h1 data-i18n="title">Sign in</h1>
      <form>
        <label for="email" data-i18n="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />

        <label for="password" data-i18n="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <button type="submit" data-i18n="submit">Login</button>

        <button type="button" class="btn-link" data-i18n="forgotPassword">
          Forgot password?
        </button>

        <button type="button" class="btn-secondary" data-i18n="createAccount">
          Create an account
        </button>

        <label for="language" data-i18n="language">Language</label>
        <select id="language" name="language" aria-label="Language selector">
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="pt">Portuguese</option>
          <option value="de">German</option>
          <option value="ja">Japanese</option>
        </select>
      </form>
    </main>
    <script>
      const translations = {
        en: {
          title: 'Sign in',
          email: 'Email',
          password: 'Password',
          submit: 'Login',
          forgotPassword: 'Forgot password?',
          createAccount: 'Create an account',
          language: 'Language',
          logoAlt: 'Oups! app logo',
        },
        fr: {
          title: 'Connexion',
          email: 'Courriel',
          password: 'Mot de passe',
          submit: 'Se connecter',
          forgotPassword: 'Mot de passe oublié ?',
          createAccount: 'Créer un compte',
          language: 'Langue',
          logoAlt: "Logo de l'application Oups!",
        },
        es: {
          title: 'Iniciar sesión',
          email: 'Correo electrónico',
          password: 'Contraseña',
          submit: 'Ingresar',
          forgotPassword: '¿Olvidaste tu contraseña?',
          createAccount: 'Crear una cuenta',
          language: 'Idioma',
          logoAlt: 'Logotipo de la aplicación Oups!',
        },
        pt: {
          title: 'Entrar',
          email: 'E-mail',
          password: 'Senha',
          submit: 'Entrar',
          forgotPassword: 'Esqueceu a senha?',
          createAccount: 'Criar uma conta',
          language: 'Idioma',
          logoAlt: 'Logotipo do aplicativo Oups!',
        },
        de: {
          title: 'Anmelden',
          email: 'E-Mail',
          password: 'Passwort',
          submit: 'Einloggen',
          forgotPassword: 'Passwort vergessen?',
          createAccount: 'Konto erstellen',
          language: 'Sprache',
          logoAlt: 'Logo der Oups!-App',
        },
        ja: {
          title: 'サインイン',
          email: 'メールアドレス',
          password: 'パスワード',
          submit: 'ログイン',
          forgotPassword: 'パスワードをお忘れですか？',
          createAccount: 'アカウントを作成',
          language: '言語',
          logoAlt: 'Oups!アプリのロゴ',
        },
      };

      function applyLanguage(lang) {
        const t = translations[lang] || translations.en;
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          if (key in t) {
            el.textContent = t[key];
          }
        });
        const logo = document.querySelector('img.logo');
        if (logo) {
          logo.alt = t.logoAlt;
        }
      }

      const select = document.getElementById('language');
      select.addEventListener('change', () => {
        applyLanguage(select.value);
        localStorage.setItem('oups-lang', select.value);
      });

      // Honour a previously saved preference stored in localStorage.
      const saved = localStorage.getItem('oups-lang');
      if (saved && saved in translations) {
        select.value = saved;
        applyLanguage(saved);
      }
    </script>
  </body>
</html>
