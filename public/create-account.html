<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oups! Portal - Create account</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      /* ── Top-bar with language picker ── */
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 8px 16px;
        background: transparent;
        z-index: 100;
      }
      .lang-widget {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #fff;
        border: 1px solid #c7cfdd;
        border-radius: 8px;
        padding: 6px 10px;
      }
      .lang-icon {
        font-size: 1.1rem;
        line-height: 1;
      }
      #language {
        border: none;
        background: transparent;
        font-size: 0.95rem;
        cursor: pointer;
        padding: 0;
        width: auto;
      }
      #language:focus {
        outline: 2px solid #3858e9;
        border-radius: 4px;
      }

      /* ── Card ── */
      main {
        width: min(90vw, 380px);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        padding: 24px;
        margin-top: 56px;
      }
      .logo {
        display: block;
        margin: 0 auto 20px auto;
        width: 120px;
        height: auto;
      }
      h1 {
        margin: 0 0 16px;
        text-align: center;
        font-size: 1.4rem;
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-weight: 600;
      }
      input,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #c7cfdd;
        border-radius: 8px;
        font-size: 1rem;
      }
      button {
        background: #3858e9;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      .submit-button {
        margin-top: 20px;
        margin-bottom: 20px;
      }
      button:hover {
        background: #2d49c4;
      }
      .btn-link {
        display: inline-block;
        width: auto;
        background: transparent;
        color: #3858e9;
        border: none;
        text-decoration: underline;
        padding: 8px 0 0;
        font-size: 0.9rem;
      }
      .btn-link:hover {
        color: #2d49c4;
        background: transparent;
      }
      .field-error {
        color: #d32f2f;
        font-size: 0.85rem;
        margin: 4px 0 0;
      }
    </style>
  </head>
  <body>
    <!-- Language selector — fixed upper-right corner -->
    <nav class="topbar" aria-label="Language selector">
      <div class="lang-widget">
        <span class="lang-icon" aria-hidden="true">🌐</span>
        <select id="language" name="language">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
          <option value="de">Deutsch</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </nav>

    <main>
      <img
        class="logo"
        src="https://oups-app.com/logo+oups-01.png"
        alt="Oups! app logo"
      />
      <h1 data-i18n="title">Create an account</h1>
      <form id="create-account-form">
        <label for="email" data-i18n="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus />
        <p id="email-error" class="field-error" hidden></p>

        <label for="password" data-i18n="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          required
        />

        <label for="password-confirm" data-i18n="passwordConfirm">Confirm password</label>
        <input
          id="password-confirm"
          name="password-confirm"
          type="password"
          autocomplete="new-password"
          required
        />
        <p id="password-confirm-error" class="field-error" hidden></p>

        <button type="submit" class="submit-button" data-i18n="submit">Create account</button>

        <button type="button" class="btn-link" data-i18n="signIn" onclick="location.href='/'">
          Sign in
        </button>
      </form>
    </main>
    <script>
      const translations = {
        en: {
          title: 'Create an account',
          email: 'Email',
          password: 'Password',
          passwordConfirm: 'Confirm password',
          submit: 'Create account',
          signIn: 'Sign in',
          logoAlt: 'Oups! app logo',
          emailRequired: 'Please fill out this field.',
          passwordRequired: 'Please fill out this field.',
          passwordConfirmRequired: 'Please fill out this field.',
          emailInvalid: 'Please enter an email address.',
          accountExists: 'An account with this email already exists.',
          passwordMismatch: 'Passwords do not match.',
        },
        fr: {
          title: 'Créer un compte',
          email: 'Courriel',
          password: 'Mot de passe',
          passwordConfirm: 'Confirmer le mot de passe',
          submit: 'Créer un compte',
          signIn: 'Se connecter',
          logoAlt: "Logo de l'application Oups!",
          emailRequired: 'Veuillez remplir ce champ.',
          passwordRequired: 'Veuillez remplir ce champ.',
          passwordConfirmRequired: 'Veuillez remplir ce champ.',
          emailInvalid: 'Veuillez saisir une adresse e-mail.',
          accountExists: 'Un compte avec cette adresse e-mail existe déjà.',
          passwordMismatch: 'Les mots de passe ne correspondent pas.',
        },
        es: {
          title: 'Crear una cuenta',
          email: 'Correo electrónico',
          password: 'Contraseña',
          passwordConfirm: 'Confirmar contraseña',
          submit: 'Crear cuenta',
          signIn: 'Iniciar sesión',
          logoAlt: 'Logotipo de la aplicación Oups!',
          emailRequired: 'Rellena este campo.',
          passwordRequired: 'Rellena este campo.',
          passwordConfirmRequired: 'Rellena este campo.',
          emailInvalid: 'Introduce una dirección de correo electrónico.',
          accountExists: 'Ya existe una cuenta con este correo electrónico.',
          passwordMismatch: 'Las contraseñas no coinciden.',
        },
        pt: {
          title: 'Criar uma conta',
          email: 'E-mail',
          password: 'Senha',
          passwordConfirm: 'Confirmar senha',
          submit: 'Criar conta',
          signIn: 'Entrar',
          logoAlt: 'Logotipo do aplicativo Oups!',
          emailRequired: 'Preencha este campo.',
          passwordRequired: 'Preencha este campo.',
          passwordConfirmRequired: 'Preencha este campo.',
          emailInvalid: 'Insira um endereço de e-mail.',
          accountExists: 'Já existe uma conta com este e-mail.',
          passwordMismatch: 'As senhas não coincidem.',
        },
        de: {
          title: 'Konto erstellen',
          email: 'E-Mail',
          password: 'Passwort',
          passwordConfirm: 'Passwort bestätigen',
          submit: 'Konto erstellen',
          signIn: 'Einloggen',
          logoAlt: 'Logo der Oups!-App',
          emailRequired: 'Bitte füllen Sie dieses Feld aus.',
          passwordRequired: 'Bitte füllen Sie dieses Feld aus.',
          passwordConfirmRequired: 'Bitte füllen Sie dieses Feld aus.',
          emailInvalid: 'Bitte geben Sie eine E-Mail-Adresse ein.',
          accountExists: 'Ein Konto mit dieser E-Mail-Adresse existiert bereits.',
          passwordMismatch: 'Die Passwörter stimmen nicht überein.',
        },
        ja: {
          title: 'アカウントを作成',
          email: 'メールアドレス',
          password: 'パスワード',
          passwordConfirm: 'パスワードの確認',
          submit: 'アカウントを作成',
          signIn: 'サインイン',
          logoAlt: 'Oups!アプリのロゴ',
          emailRequired: 'このフィールドを入力してください。',
          passwordRequired: 'このフィールドを入力してください。',
          passwordConfirmRequired: 'このフィールドを入力してください。',
          emailInvalid: 'メールアドレスを入力してください。',
          accountExists: 'このメールアドレスは既に登録されています。',
          passwordMismatch: 'パスワードが一致しません。',
        },
      };

      function getValidationMessage(field, lang) {
        const t = translations[lang] || translations.en;
        if (field.validity.valueMissing) {
          if (field.id === 'email') return t.emailRequired;
          if (field.id === 'password') return t.passwordRequired;
          if (field.id === 'password-confirm') return t.passwordConfirmRequired;
        }
        if (field.id === 'email' && field.validity.typeMismatch) {
          return t.emailInvalid;
        }
        return '';
      }

      function updateFieldValidationMessage(field, lang) {
        field.setCustomValidity('');
        const message = getValidationMessage(field, lang);
        if (message) field.setCustomValidity(message);
      }

      function updateValidationMessages(lang) {
        [emailInput, passwordInput, passwordConfirmInput].forEach((field) => {
          if (field.matches(':invalid')) {
            updateFieldValidationMessage(field, lang);
          } else {
            field.setCustomValidity('');
          }
        });
      }

      function applyLanguage(lang) {
        const t = translations[lang] || translations.en;
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          if (key in t) el.textContent = t[key];
        });
        const logo = document.querySelector('img.logo');
        if (logo) logo.alt = t.logoAlt;
        updateValidationMessages(lang);
      }

      const select = document.getElementById('language');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const passwordConfirmInput = document.getElementById('password-confirm');
      const emailError = document.getElementById('email-error');
      const passwordConfirmError = document.getElementById('password-confirm-error');

      [emailInput, passwordInput, passwordConfirmInput].forEach((field) => {
        field.addEventListener('invalid', () => {
          const activeLang = select.value in translations ? select.value : 'en';
          updateFieldValidationMessage(field, activeLang);
        });
        field.addEventListener('input', () => {
          field.setCustomValidity('');
        });
      });

      // Hide server-side errors when the user starts editing
      emailInput.addEventListener('input', () => {
        emailError.hidden = true;
      });
      passwordConfirmInput.addEventListener('input', () => {
        passwordConfirmError.hidden = true;
      });

      document.getElementById('create-account-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const lang = select.value in translations ? select.value : 'en';
        const t = translations[lang];

        // Client-side password-match check
        if (passwordInput.value !== passwordConfirmInput.value) {
          passwordConfirmError.textContent = t.passwordMismatch;
          passwordConfirmError.hidden = false;
          return;
        }

        try {
          const res = await fetch('/create-account', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailInput.value, password: passwordInput.value }),
          });

          if (res.status === 409) {
            emailError.textContent = t.accountExists;
            emailError.hidden = false;
            return;
          }

          if (res.ok) {
            location.href = '/';
          }
        } catch (_err) {
          // Network error — leave the form as-is
        }
      });

      select.addEventListener('change', () => {
        applyLanguage(select.value);
        localStorage.setItem('oups-lang', select.value);
      });

      const saved = localStorage.getItem('oups-lang');
      if (saved && saved in translations) {
        select.value = saved;
        applyLanguage(saved);
      } else {
        const browserLang = (navigator.language || '').split('-')[0].toLowerCase();
        if (browserLang && browserLang in translations) {
          select.value = browserLang;
          applyLanguage(browserLang);
        }
      }
    </script>
  </body>
</html>
